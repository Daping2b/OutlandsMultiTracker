name: Fetch Weekly Region Bonuses

on:
  schedule:
    - cron: '5 0 * * 6'
    - cron: '*/5 0-2 * * 6'
  workflow_dispatch:

jobs:
  fetch-bonuses:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install requests

      - name: Fetch bonuses from Outlands Butler
        run: |
          python3 << 'PYEOF'
          import requests, json, re, sys
          from datetime import datetime, timedelta

          SITE = "https://www.outlandsbutler.com/"
          UA = "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/149.0.0.0 Safari/537.36"

          # La cle publique du site change quand son proprietaire la fait tourner (ex. 2026-10-21) :
          # on la relit a chaque execution dans la configuration publique de la page d'accueil.
          try:
              page = requests.get(SITE, headers={"User-Agent": UA}, timeout=20)
              page.raise_for_status()
              m = re.search(r'supabase:\{url:"([^"]+)",key:"([^"]+)"', page.text)
          except Exception as e:
              print(f"KEY_EXTRACTION_FAILED: page inaccessible ({type(e).__name__})"); sys.exit(1)
          if not m:
              print("KEY_EXTRACTION_FAILED: configuration Supabase introuvable dans la page (structure du site changee ?)"); sys.exit(1)
          base_url, SUPABASE_KEY = m.group(1), m.group(2)
          SUPABASE_URL = base_url.rstrip("/") + "/rest/v1/weeklyBonuses"

          headers = {
              "apikey":        SUPABASE_KEY,
              "Accept":        "application/json",
              "Origin":        "https://www.outlandsbutler.com",
              "Referer":       "https://www.outlandsbutler.com/",
              "User-Agent":    UA
          }
          # Les anciennes cles (JWT) se doublaient d'un en-tete Authorization ; les nouvelles cles
          # « sb_publishable_ » n'en veulent pas.
          if SUPABASE_KEY.count(".") == 2:
              headers["Authorization"] = f"Bearer {SUPABASE_KEY}"

          r = requests.get(f"{SUPABASE_URL}?select=*&order=id.asc", headers=headers, timeout=15)
          if r.status_code != 200:
              print(f"Supabase API error: {r.status_code} {r.text}")
              sys.exit(1)

          rows = r.json()
          print(f"Fetched {len(rows)} rows from Supabase")
          if not rows:
              print("No data returned"); sys.exit(1)

          # Supabase format per row:
          # {"id": 1, "Bonus": "Sanctuary Dungeon", "Location": "Inferno",
          #  "LastUpdated": "2026-06-13T00:00:21.511+00:00"}
          # OMT format:
          # {"2026-06-13": {"Inferno": {"value": "+25%", "type": "sanctuary", "label": "Sanctuary Dungeon"}}}

          bonus_type_map = {
              "sanctuary dungeon": "sanctuary",
              "challenger dungeon": "challenger",
              "faster respawn":     "respawn",
              "gold loot":          "gold_loot",
              "experience":         "experience",
              "vendor rebate":      "vendor",
              "exceptional crafting":"crafting",
          }

          def get_week_key(dt):
              days_since_sat = (dt.weekday() + 2) % 7
              return (dt - timedelta(days=days_since_sat)).strftime("%Y-%m-%d")

          def parse_bonus_type(bonus_str):
              bl = bonus_str.lower()
              for k, v in bonus_type_map.items():
                  if k in bl: return v
              return "unknown"

          # Group rows by week
          weeks = {}
          for row in rows:
              last_updated = row.get("LastUpdated","")
              try:
                  dt = datetime.fromisoformat(str(last_updated).replace("Z","+00:00")).replace(tzinfo=None)
                  week_key = get_week_key(dt)
              except:
                  week_key = get_week_key(datetime.utcnow())

              location = row.get("Location","Unknown")
              bonus    = row.get("Bonus","")

              # Parse value from bonus string e.g. "+25% Faster Respawn" or "Sanctuary Dungeon"
              value_match = re.match(r'^([+-][\d.]+%)\s+(.+)$', bonus)
              if value_match:
                  value = value_match.group(1)
                  label = value_match.group(2)
              else:
                  # No value prefix — dungeon type bonus (no % value)
                  value = ""
                  label = bonus

              btype = parse_bonus_type(label)

              if week_key not in weeks:
                  weeks[week_key] = {}
              weeks[week_key][location] = {"value": value, "type": btype, "label": label}

          print(f"Parsed {len(weeks)} weeks: {list(weeks.keys())}")

          bonuses_path = "config/bonuses.json"
          try:
              with open(bonuses_path) as f:
                  bonuses = json.load(f)
          except:
              bonuses = {}

          new_entries = 0
          for week_key, week_data in weeks.items():
              if week_key not in bonuses:
                  bonuses[week_key] = week_data
                  new_entries += 1
                  print(f"Added week {week_key}: {list(week_data.keys())}")
              else:
                  # Update existing week with any new locations
                  for loc, data in week_data.items():
                      if loc not in bonuses[week_key]:
                          bonuses[week_key][loc] = data
                  print(f"Week {week_key} already present, checked for updates")

          if new_entries == 0:
              current_week = get_week_key(datetime.utcnow())
              if current_week not in bonuses:
                  print(f"Current week {current_week} missing — will retry")
                  sys.exit(1)
              print("No new weeks to add")
          
          with open(bonuses_path, "w") as f:
              json.dump(bonuses, f, indent=2, ensure_ascii=False)
          print(f"Saved bonuses.json with {len(bonuses)} weeks")
          PYEOF

      - name: Commit bonuses
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add config/bonuses.json
          git diff --staged --quiet || git commit -m "Weekly bonuses $(date +%Y-%m-%d)"
          git push
