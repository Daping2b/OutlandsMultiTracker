name: Fetch Weekly Region Bonuses

on:
  schedule:
    - cron: '5 0 * * 6'
    - cron: '*/5 0-2 * * 6'
  workflow_dispatch:

jobs:
  fetch-bonuses:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install requests

      - name: Fetch bonuses from Outlands Butler
        run: |
          python3 << 'PYEOF'
          import requests, json, sys
          from datetime import datetime, timezone, timedelta

          SUPABASE_URL = "https://inbuomjlmfztlaknwjze.supabase.co/rest/v1/weeklyBonuses"
          SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImluYnVvbWpsbWZ6dGxha253anplIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzkyMDQ5MTgsImV4cCI6MjA5NDc4MDk1OH0.5Sxe5ApAsmzTq27z_C18IHGO55MIEVk5xahSouP1Sy0"

          headers = {
              "apikey":        SUPABASE_KEY,
              "Authorization": f"Bearer {SUPABASE_KEY}",
              "Accept":        "application/json",
              "Origin":        "https://www.outlandsbutler.com",
              "Referer":       "https://www.outlandsbutler.com/",
              "User-Agent":    "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/149.0.0.0 Safari/537.36"
          }

          r = requests.get(f"{SUPABASE_URL}?select=*&order=id.asc", headers=headers, timeout=15)
          if r.status_code != 200:
              print(f"Supabase API error: {r.status_code} {r.text}")
              sys.exit(1)

          rows = r.json()
          print(f"Fetched {len(rows)} rows from Supabase")
          if not rows:
              print("No data returned")
              sys.exit(1)

          bonuses_path = "config/bonuses.json"
          try:
              with open(bonuses_path) as f:
                  bonuses = json.load(f)
          except:
              bonuses = {}

          def get_week_key(dt):
              days_since_sat = (dt.weekday() + 2) % 7
              return (dt - timedelta(days=days_since_sat)).strftime("%Y-%m-%d")

          new_entries = 0
          for row in rows:
              print(f"Row keys: {list(row.keys())} — sample: {str(row)[:200]}")
              # Adapt key mapping based on actual column names
              week_date = row.get("week_start") or row.get("weekStart") or row.get("date") or row.get("created_at","")
              try:
                  dt = datetime.fromisoformat(str(week_date).replace("Z","+00:00"))
                  week_key = get_week_key(dt.replace(tzinfo=None))
              except:
                  week_key = get_week_key(datetime.utcnow())

              if week_key in bonuses:
                  print(f"Week {week_key} already present, skipping")
                  continue

              bonuses[week_key] = row
              new_entries += 1
              print(f"Added week {week_key}")

          if new_entries == 0:
              print("No new weeks to add")
              now = datetime.utcnow()
              if get_week_key(now) not in bonuses:
                  print("Current week still missing — retrying")
                  sys.exit(1)
          else:
              with open(bonuses_path, "w") as f:
                  json.dump(bonuses, f, indent=2, ensure_ascii=False)
              print(f"Saved {len(bonuses)} weeks to bonuses.json")
          PYEOF

      - name: Commit bonuses
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add config/bonuses.json
          git diff --staged --quiet || git commit -m "Weekly bonuses $(date +%Y-%m-%d)"
          git push
